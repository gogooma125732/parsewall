services:
  api:
    build: .
    image: ${DIF_IMAGE:-document-injection-firewall:1.0.0}
    init: true
    environment:
      DIF_JOB_STORE: /var/lib/dif/jobs
      PORT: "8000"
    ports:
      - "${DIF_BIND_ADDRESS:-127.0.0.1}:${DIF_PORT:-8000}:8000"
    volumes:
      - jobs:/var/lib/dif/jobs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  worker:
    image: ${DIF_IMAGE:-document-injection-firewall:1.0.0}
    init: true
    entrypoint: ["document-firewall-worker"]
    command: ["--store", "/var/lib/dif/jobs", "--interval", "0.5"]
    environment:
      DIF_TESSERACT: /usr/bin/tesseract
      DIF_LIBREOFFICE: /usr/bin/libreoffice
    volumes:
      - jobs:/var/lib/dif/jobs
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 2.0
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  jobs: {}
