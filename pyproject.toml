[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parsewall"
version = "0.1.0"
description = "Fail-closed document inspection before untrusted files reach an LLM"
readme = "README.md"
authors = [{ name = "Parsewall maintainers" }]
requires-python = ">=3.11"
keywords = ["ai-security", "llm-security", "prompt-injection", "document-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.116",
  "mcp>=1.13",
  "Pillow>=11.0",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "PyMuPDF>=1.25",
  "python-multipart>=0.0.20",
  "tinycss2>=1.5.1",
  "uvicorn>=0.35",
]

[project.urls]
Homepage = "https://github.com/gogooma125732/parsewall"
Repository = "https://github.com/gogooma125732/parsewall.git"
Issues = "https://github.com/gogooma125732/parsewall/issues"
Releases = "https://github.com/gogooma125732/parsewall/releases"

[project.scripts]
parsewall = "injection_firewall.cli:main"
parsewall-api = "injection_firewall.api:main"
parsewall-worker = "injection_firewall.worker:main"
parsewall-mcp = "injection_firewall.mcp_server:main"
document-firewall = "injection_firewall.cli:main"
document-firewall-api = "injection_firewall.api:main"
document-firewall-worker = "injection_firewall.worker:main"
document-firewall-mcp = "injection_firewall.mcp_server:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/injection_firewall"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
