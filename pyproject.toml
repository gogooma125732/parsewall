[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-injection-firewall"
version = "0.1.0"
description = "Closed result contract for document injection scanning"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1", "pydantic>=2.0", "tinycss2>=1.5.1"]

[project.scripts]
document-firewall = "injection_firewall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/injection_firewall"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
